[/Script/EngineSettings.GameMapsSettings]
; Leere Engine-Map – der FightDirector baut Arena, Licht und Kamera zur Laufzeit.
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/FightGame.FightGameMode
; Lokales 1v1 auf EINEM Bildschirm
bUseSplitscreen=False
; Gamepad 1 -> Spieler 1, Gamepad 2 -> Spieler 2
bOffsetPlayerGamepadIds=False

[/Script/Engine.RendererSettings]
; Anime-Look braucht keine realistische Beleuchtung -> billig, perfekt für Handhelds (Steam Deck / Switch 2)
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AmbientOcclusion=False
; Scharfe Linien statt TAA-Unschärfe (FXAA)
r.AntiAliasingMethod=1

[/Script/Engine.Engine]
; Sim läuft fest mit 60 Hz im FightDirector, Rendering darf frei laufen
bSmoothFrameRate=False
